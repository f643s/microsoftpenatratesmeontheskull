name: Build patched IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build patched iOS IPA
    runs-on: macos-15

    steps:
      - name: Remove work folders
        env:
          password: ${{ secrets.ELLIE_MINI_SECRET }}
        run: |
          echo "before"
          ls -lah ./
          echo $password | sudo -S rm -rf ./* || true
          echo $password | sudo -S rm -rf ./.??* || true
          echo "after"
          ls -lah ./

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout repository submodules
        run: git submodule update --init --recursive

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install GNU make
        run: brew install make

      - name: Install JDK 8
        run: |
          brew install --cask temurin@8
          echo "JAVA_HOME=$(/usr/libexec/java_home -v 1.8)" >> "$GITHUB_ENV"

      - name: Install ldid
        run: brew install ldid

      - name: Build patched iOS IPA
        env:
          password: ${{ secrets.ELLIE_MINI_SECRET }}
        run: |
          export PATH=/opt/procursus/bin:/opt/homebrew/opt/make/libexec/gnubin:/opt/homebrew/bin:$PATH
          export SLIMMED=1
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2 TROLLSTORE_JIT_ENT=1

      - name: Upload regular ipa
        uses: actions/upload-artifact@v4
        with:
          name: org.angelauramc.amethyst-patched-ios.ipa
          path: artifacts/org.angelauramc.amethyst-*-ios.ipa

      - name: Upload patched tipa (TrollStore JIT)
        uses: actions/upload-artifact@v4
        with:
          name: org.angelauramc.amethyst-patched-ios.tipa
          path: artifacts/org.angelauramc.amethyst-*-ios-trollstore.tipa

      - name: Upload slimmed ipa
        uses: actions/upload-artifact@v4
        with:
          name: org.angelauramc.amethyst-patched.slimmed-ios.ipa
          path: artifacts/org.angelauramc.amethyst.slimmed-*-ios.ipa

      - name: Upload slimmed tipa
        uses: actions/upload-artifact@v4
        with:
          name: org.angelauramc.amethyst-patched.slimmed-ios.tipa
          path: artifacts/org.angelauramc.amethyst.slimmed-*-ios-trollstore.tipa
